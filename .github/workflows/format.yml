name: Format

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".npmrc"
      - "package.json"
      - "package-lock.json"
      - "**.yml"
      - "**.yaml"
      - "**.md"

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=24.15.0 <25"
          package-manager-cache: false

      - run: npm ci --ignore-scripts
      - run: ./node_modules/.bin/prettier --check "**/*.{yml,yaml}"
      - run: ./node_modules/.bin/prettier --check --prose-wrap always "**/*.md"
