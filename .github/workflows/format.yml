name: Format

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".npmrc"
      - "package.json"
      - "package-lock.json"
      - "**.yml"
      - "**.yaml"
      - "**.md"

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "25"

      - run: npm ci --ignore-scripts
      - run: ./node_modules/.bin/prettier --check "**/*.{yml,yaml}"
      - run: ./node_modules/.bin/prettier --check --prose-wrap always "**/*.md"
